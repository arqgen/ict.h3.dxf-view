services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: cad_viewer_phoenix
    ports:
      # 6006 serve a UI e o endpoint OTLP/HTTP /v1/traces que a API usa
      - "${PHOENIX_PORT:-6006}:6006"
    volumes:
      - phoenix_data:/root/.phoenix
    restart: unless-stopped

volumes:
  phoenix_data:
